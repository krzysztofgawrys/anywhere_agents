# Claude Web Worker (Claude SDK) - standalone compose for remote machines
#
# Two deployment modes. Pick ONE by setting WORKER_MODE in .env:
#
# ── server (default, classic) ───────────────────────────────────────────
#   Worker listens on port 8002. Hub dials it via the URL in workers.json.
#   Use this when hub can reach the worker (LAN, Tailscale, VPC routing,
#   etc.).
#
#   Setup:
#     1. Clone repo on remote machine.
#     2. Run `claude login` on host once (creates ~/.claude/).
#     3. Create .env with UID, GID, WORKER_SECRET matching hub.
#     4. Edit volume mounts for your project directories.
#     5. docker compose -f worker-claude-compose.yml up -d --build
#
#   Hub's workers.json entry:
#     {
#       "id": "remote-claude", "type": "claude", "label": "Remote",
#       "url": "ws://<this-machine>:8002/ws", "secret": "..."
#     }
#
# ── inbound (reverse mode) ──────────────────────────────────────────────
#   Worker dials OUT to the hub. No inbound port needed. Use this when
#   the worker is in a closed VPC, behind a NAT, or in a corporate
#   network where only egress 443 is allowed.
#
#   Set in .env:
#     WORKER_MODE=inbound
#     HUB_PUBLIC_URL=https://hub.example.com    (publicly reachable hub URL,
#                                                used for control + data WS)
#     WORKER_ID=remote-claude            (must match workers.json entry)
#     WORKER_LABEL=Remote                (cosmetic)
#     WORKER_SECRET=...                  (same as hub)
#
#   If the hub is behind Cloudflare Access with service-token policies
#   on /worker-register and /worker-data, also set:
#     CF_ACCESS_CLIENT_ID=<service token client id>
#     CF_ACCESS_CLIENT_SECRET=<service token client secret>
#
#   Hub's workers.json entry (note: no "url" needed):
#     {
#       "id": "remote-claude", "type": "claude", "label": "Remote",
#       "mode": "inbound", "secret": "..."
#     }
#
#   In inbound mode the `ports:` block below can be removed - the worker
#   doesn't need a listening port at all. Leaving it exposes /health for
#   liveness checks but the /ws endpoint will actively refuse connections.
#
#   Note for inbound mode: /internal/upload (HTTP multipart) is mounted
#   but the hub can't reach it directly. File upload still works for
#   inbound workers via a fresh WS data channel (hub opens it through
#   the control channel, sends the file as a single base64-encoded
#   message). Practical limit ~12 MiB raw per upload (bounded by
#   uvicorn ws_max_size). Outbound workers keep the streaming HTTP
#   path with no such limit.

services:
  worker-claude:
    build:
      context: .
      dockerfile: docker/worker-claude.Dockerfile
    container_name: claude-web-worker-claude
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      # Only meaningful in server mode. In inbound mode the /ws endpoint
      # refuses connections (logged on startup); /health stays available
      # for liveness probes. Comment this out for a fully closed-ingress
      # inbound deployment.
      - "${WORKER_PORT:-8002}:8002"
    environment:
      - HOME=/home/app
      - WORKER_SECRET=${WORKER_SECRET:-changeme}
      # Hub URL for out-of-band push notification delivery.
      # MUST be reachable from this worker (LAN, VPN, or reverse tunnel).
      # Leave unset to disable push from this worker.
      - HUB_URL=${HUB_URL:-}
      # ── Reverse (inbound) mode (uncomment to enable) ────────────────
      # - WORKER_MODE=inbound
      # - HUB_PUBLIC_URL=${HUB_PUBLIC_URL:-https://hub.example.com}
      # - WORKER_ID=${WORKER_ID:-remote-claude}
      # - WORKER_LABEL=${WORKER_LABEL:-Remote}
      # - WORKER_TYPE=claude
      # ── Optional: hub behind Cloudflare Access with service tokens ─
      # - CF_ACCESS_CLIENT_ID=${CF_ACCESS_CLIENT_ID:-}
      # - CF_ACCESS_CLIENT_SECRET=${CF_ACCESS_CLIENT_SECRET:-}
    volumes:
      # Claude auth (claude login), settings, project session history
      - ${HOME}/.claude:/home/app/.claude
      - ${HOME}/.claude.json:/home/app/.claude.json
      # Worker DB (projects index) - create dir first: mkdir -p ~/.claude-web
      - ${HOME}/.claude-web:/home/app/.claude-web
      # Git credentials (read-only)
      - ${HOME}/.ssh:/home/app/.ssh:ro
      - ${HOME}/.gitconfig:/home/app/.gitconfig:ro
      # ── Project roots ──────────────────────────────────────────────────
      # Mount at the SAME absolute path as on host so cwd from
      # ~/.claude/projects/*.jsonl resolves correctly inside the container.
      # Add more lines below for additional project directories.
      - ${HOME}/code:${HOME}/code
