[project]
name = "claude-web-worker"
version = "0.1.0"
description = "Claude Web worker - runs Claude SDK sessions, project scanning, file browser"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.0",
    "pydantic>=2.9.0",
    "structlog>=24.4.0",
    "aiosqlite>=0.20.0",
    # >=0.2.153 bundles Claude Code CLI 2.1.273. The SDK prefers its own
    # bundled CLI over `claude` on PATH, and the API returns HTTP 400 for
    # newer models (Fable 5.1) when that bundled CLI predates 2.1.251.
    "claude-agent-sdk>=0.2.153",
    "httpx>=0.27.0",
    "fastembed>=0.4.0",
    "worker-shared",
]

[tool.uv.sources]
worker-shared = { path = "../shared", editable = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "mypy>=1.11.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
