[project]
name = "worker-shared"
version = "0.1.0"
description = "Shared modules for Claude Web workers (db, files, terminal, locks, projects service, session registry)"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20.0",
    "structlog>=24.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker_shared"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
