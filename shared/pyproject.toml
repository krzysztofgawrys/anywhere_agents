[project]
name = "worker-shared"
version = "0.1.0"
description = "Shared modules for Claude Web workers (db, files, terminal, locks, projects service, session registry)"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20.0",
    "cryptography>=43.0.0",
    "structlog>=24.4.0",
    "numpy>=1.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker_shared"]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true

# fastembed ships no type stubs; it's an optional local-embeddings backend
# imported lazily in worker_shared.knowledge.embed.
[[tool.mypy.overrides]]
module = ["fastembed", "fastembed.*"]
ignore_missing_imports = true
