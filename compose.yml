# Claude Web - hub + worker architecture
#
# Usage:
#   cp .env.example .env   # fill in your values
#   docker compose up -d   # build + start
#   docker compose logs -f # follow logs
#
# Hub:            frontend proxy + auth + push notifications
# worker-claude:  Anthropic Claude SDK, project scanning, terminal, file browser
# worker-copilot: GitHub Copilot SDK (skeleton; phase 4 wires the real SDK)

services:
  hub:
    build:
      context: .
      dockerfile: docker/hub.Dockerfile
    container_name: claude-web-hub
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "${PORT:-127.0.0.1:8001}:8001"
    env_file:
      - path: .env
        required: false
    environment:
      - HOME=/home/app
      # Shared secret - authenticates the worker's HTTP push callbacks.
      # Same value the worker uses for its inbound WS auth (hub→worker).
      - WORKER_SECRET=${WORKER_SECRET:-changeme}
    volumes:
      # Worker config - hub reads this on startup
      - ./workers.json:/config/workers.json:ro
      # Push notification keys (VAPID)
      - ${HOME}/.claude-web:/home/app/.claude-web
      # Dev override: mount frontend build so that worker (Claude) can
      # run `npm run build` and hub serves new files instantly.
      - ./frontend-dist:/app/src/static-mount
    depends_on:
      worker-claude:
        condition: service_healthy
      # Hub tries to connect to worker-copilot on every client WS handshake.
      # service_started (not _healthy) so a Copilot worker hiccup never blocks
      # hub startup - hub already handles unreachable workers gracefully.
      worker-copilot:
        condition: service_started

  worker-claude:
    build:
      context: .
      dockerfile: docker/worker-claude.Dockerfile
    container_name: claude-web-worker-claude
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      - HOME=/home/app
      - WORKER_SECRET=${WORKER_SECRET:-changeme}
      # Hub address for out-of-band push delivery (POST /api/internal/push).
      # Worker uses HTTP instead of WS for push_notify so it works after the
      # client WS is gone (PWA killed on Android, etc.).
      - HUB_URL=${HUB_URL:-http://hub:8001}
    volumes:
      # Claude auth (claude login), settings, project session history
      - ${HOME}/.claude:/home/app/.claude
      - ${HOME}/.claude.json:/home/app/.claude.json
      # Worker DB (projects index)
      - ${HOME}/.claude-web:/home/app/.claude-web
      # Git credentials (read-only)
      - ${HOME}/.ssh:/home/app/.ssh
      - ${HOME}/.gitconfig:/home/app/.gitconfig:ro
      # ── Project roots ──────────────────────────────────────────────────
      # Mount at the SAME absolute path as on host so that cwd recorded in
      # ~/.claude/projects/*.jsonl resolves correctly inside the container.
      # Add more lines below for additional project directories.
      - ${HOME}/code:${HOME}/code
      - ${HOME}/elec:${HOME}/elec
      - ${HOME}/insp:${HOME}/insp

  # Second worker-claude instance running in reverse (inbound) mode.
  # EXAMPLE / OPT-IN: hidden behind a docker compose profile so it does
  # NOT start with the plain `docker compose up -d`. To launch it
  # alongside the rest of the stack:
  #
  #   docker compose --profile reverse-test up -d --build worker-claude-remote
  #
  # Smoke-test target for end-to-end validation of worker-claude inbound
  # without taking down the primary worker-claude (which is the active
  # container for the running Claude Code session driving this repo).
  #
  # Prereqs before launching:
  #   - ~/.claude-remote/ exists on the host as a copy of ~/.claude/
  #     (so this worker has its own auth + session history isolated from
  #     the primary worker-claude container)
  #   - ~/.claude-remote.json exists as a copy of ~/.claude.json
  #   - workers.json contains an inbound entry with id "remote-claude"
  #     (see workers.json.example for the shape)
  #   - .env has WORKER_SECRET, HUB_PUBLIC_URL, and (if hub is behind
  #     CF Access) CF_ACCESS_CLIENT_ID/SECRET
  #
  # Isolated state:
  # - ~/.claude-remote (host) -> /home/app/.claude (container): private
  #   copy of auth + session history so the two workers don't fight over
  #   ~/.claude/projects/*.jsonl writes.
  # - Separate SQLite path (worker-claude-remote.sqlite) so the projects
  #   index doesn't collide with the primary worker's DB.
  # - No `ports:` block - inbound workers don't need a listening port.
  # - Same project root mounts as the primary worker so both see the
  #   same code; user picks per-session which worker handles the prompt.
  worker-claude-remote:
    profiles: ["reverse-test"]
    build:
      context: .
      dockerfile: docker/worker-claude.Dockerfile
    container_name: claude-web-worker-claude-remote
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      - HOME=/home/app
      - WORKER_SECRET=${WORKER_SECRET:-changeme}
      # Internal hub URL for push notifications (worker -> hub HTTP).
      - HUB_URL=${HUB_URL:-http://hub:8001}
      # Reverse-mode dial-out target (public hub URL through CF Tunnel).
      - WORKER_MODE=inbound
      - HUB_PUBLIC_URL=${HUB_PUBLIC_URL:-https://claude.gawrys.cloud}
      - WORKER_ID=remote-claude
      - WORKER_LABEL=Remote claude (reverse)
      - WORKER_TYPE=claude
      - CF_ACCESS_CLIENT_ID=${CF_ACCESS_CLIENT_ID:-}
      - CF_ACCESS_CLIENT_SECRET=${CF_ACCESS_CLIENT_SECRET:-}
      # Separate SQLite path so this worker's project index doesn't
      # collide with worker-claude (primary)'s db.sqlite under the
      # same ~/.claude-web mount.
      - CLAUDE_WEB_DB_PATH=/home/app/.claude-web/worker-claude-remote.sqlite
    volumes:
      # Isolated Claude state (copy of ~/.claude on host).
      - ${HOME}/.claude-remote:/home/app/.claude
      - ${HOME}/.claude-remote.json:/home/app/.claude.json
      # Shared worker DB dir (DB file path is unique via env above).
      - ${HOME}/.claude-web:/home/app/.claude-web
      - ${HOME}/.ssh:/home/app/.ssh
      - ${HOME}/.gitconfig:/home/app/.gitconfig:ro
      # Same project roots as the primary worker.
      - ${HOME}/code:${HOME}/code
      - ${HOME}/elec:${HOME}/elec
      - ${HOME}/insp:${HOME}/insp

  worker-copilot:
    build:
      context: .
      dockerfile: docker/worker-copilot.Dockerfile
    container_name: claude-web-worker-copilot
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      - HOME=/home/app
      - WORKER_SECRET=${WORKER_SECRET:-changeme}
      # Internal hub URL for out-of-band push notifications (worker -> hub
      # HTTP POST to /api/internal/push). Stays as docker-internal hostname
      # since push doesn't need to traverse CF Access.
      - HUB_URL=${HUB_URL:-http://hub:8001}
      - COPILOT_HOME=/home/app/.copilot
      # Separate SQLite from worker-claude so each worker has an independent
      # project list (different scanners, different on-disk sources).
      - CLAUDE_WEB_DB_PATH=/home/app/.claude-web/worker-copilot.sqlite
      # ── Reverse (inbound) mode ──────────────────────────────────────
      # Worker dials OUT to the hub via the public URL (through CF Tunnel
      # + CF Access). This is the full production data path - latency
      # adds a CF hop, but it validates the whole stack end-to-end.
      - WORKER_MODE=${WORKER_MODE:-server}
      - HUB_PUBLIC_URL=${HUB_PUBLIC_URL:-https://claude.gawrys.cloud}
      - WORKER_ID=${WORKER_ID:-remote-copilot}
      - WORKER_LABEL=${WORKER_LABEL:-Remote}
      - WORKER_TYPE=copilot
      - CF_ACCESS_CLIENT_ID=${CF_ACCESS_CLIENT_ID:-}
      - CF_ACCESS_CLIENT_SECRET=${CF_ACCESS_CLIENT_SECRET:-}
    volumes:
      # Copilot auth + session state (host must have run `copilot` to log in)
      - ${HOME}/.copilot:/home/app/.copilot
      # Worker DB (separate file, see CLAUDE_WEB_DB_PATH above)
      - ${HOME}/.claude-web:/home/app/.claude-web
      # Git credentials
      - ${HOME}/.ssh:/home/app/.ssh
      - ${HOME}/.gitconfig:/home/app/.gitconfig:ro
      # ── Project roots ──────────────────────────────────────────────────
      # Same absolute-path convention as worker-claude so workspace_path
      # recorded by Copilot in ~/.copilot/session-state resolves correctly.
      - ${HOME}/code:${HOME}/code

  # worker-codex (OpenAI Codex CLI). Off-by-default behind a profile
  # because it needs `codex login` on the host (~/.codex/auth.json) and
  # the Codex CLI binary - both absent until the operator opts in.
  # Launch alongside the rest of the stack with:
  #   docker compose --profile codex up -d --build worker-codex
  worker-codex:
    profiles: ["codex"]
    build:
      context: .
      dockerfile: docker/worker-codex.Dockerfile
    container_name: claude-web-worker-codex
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      - HOME=/home/app
      - WORKER_SECRET=${WORKER_SECRET:-changeme}
      - HUB_URL=${HUB_URL:-http://hub:8001}
      - CODEX_HOME=/home/app/.codex
      - CLAUDE_WEB_DB_PATH=/home/app/.claude-web/worker-codex.sqlite
    volumes:
      - ${HOME}/.codex:/home/app/.codex
      - ${HOME}/.claude-web:/home/app/.claude-web
      - ${HOME}/.ssh:/home/app/.ssh
      - ${HOME}/.gitconfig:/home/app/.gitconfig:ro
      - ${HOME}/code:${HOME}/code

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: claude-web-tunnel
    restart: unless-stopped
    command: tunnel run
    env_file:
      - path: .env
        required: false
    environment:
      # Set TUNNEL_TOKEN in .env (it's a secret - keep it out of the repo).
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:-}
    depends_on:
      hub:
        condition: service_healthy
