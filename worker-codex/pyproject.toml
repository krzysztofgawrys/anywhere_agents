[project]
name = "claude-web-worker-codex"
version = "0.1.0"
description = "Claude Web worker (OpenAI Codex SDK) - runs Codex agent sessions, project scanning, file browser"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.0",
    "pydantic>=2.9.0",
    "structlog>=24.4.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    # openai-codex-sdk wraps the bundled `codex` CLI (Rust binary from
    # OpenAI) and communicates over JSONL on stdin/stdout. Auth state is
    # read from ~/.codex/auth.json (created by `codex login` on the host).
    "openai-codex-sdk>=0.1.0",
    "worker-shared",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "mypy>=1.11.0",
    "ruff>=0.6.0",
]

[tool.uv.sources]
worker-shared = { path = "../shared", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
