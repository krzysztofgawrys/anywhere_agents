# Auto-merged override (docker compose loads this automatically).
# Adds a second co-located Claude worker serving ~/elec, registered in
# the hub as worker id "elec". Isolated .claude-web state (named volume)
# so its bootstrap/DB never collides with the primary worker. Shares
# ~/.claude so it reuses the same `claude login`.
# Remove this file (and the workers.json "elec" entry) to undo.

services:
  worker-claude-elec:
    build:
      context: .
      dockerfile: docker/worker-claude-elec.Dockerfile
    container_name: claude-web-worker-claude-elec
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    # ── USB passthrough (electronics toolchain) ────────────────────────
    # WSL2 host: devices must first be `usbipd attach`ed from Windows so
    # they appear here as /dev/ttyACM*. Then we hand them to the container.
    #   - /dev/ttyACM0 = 1a86:fe0c USB Serial  (board UART console)
    #   - /dev/ttyACM1 = 1a86:8010 WCH-Link    (RISC-V probe; flashes via libusb)
    # group_add lets uid 1000 open the nodes (dialout=20, plugdev=46).
    # The /dev/bus/usb bind + cgroup rule give libusb (WCH-Link, dfu, etc.)
    # raw access that survives device re-enumeration on replug.
    group_add:
      - "20"   # dialout  -> /dev/ttyACM0
      - "46"   # plugdev  -> /dev/ttyACM1 + WCH-Link raw USB
    devices:
      - /dev/ttyACM0:/dev/ttyACM0
      - /dev/ttyACM1:/dev/ttyACM1
    device_cgroup_rules:
      - "c 166:* rmw"   # ttyACM* (major 166)
      - "c 189:* rmw"   # USB bus devices (major 189, libusb)
    environment:
      - HOME=/home/app
      - WORKER_SECRET=${WORKER_SECRET:-changeme}
      - HUB_URL=${HUB_URL:-http://hub:8001}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - CLAUDE_WEB_DB_PATH=/home/app/.claude-web/db.sqlite
      # Project Knowledge (agent-curated RAG). Persist the local embedding
      # model on the isolated elec state volume so it downloads once.
      - KNOWLEDGE_EMBED_CACHE=/home/app/.claude-web/fastembed
      # Short idle window so consolidation is easy to observe while testing.
      - KNOWLEDGE_CONSOLIDATE_IDLE_SEC=${KNOWLEDGE_CONSOLIDATE_IDLE_SEC:-120}
    volumes:
      - ${HOME}/.claude:/home/app/.claude
      - ${HOME}/.claude.json:/home/app/.claude.json
      - claude-web-elec-state:/home/app/.claude-web
      - ${HOME}/.ssh:/home/app/.ssh:ro
      - ${HOME}/.gitconfig:/home/app/.gitconfig:ro
      # Raw USB tree for libusb-based flashers (survives replug).
      - /dev/bus/usb:/dev/bus/usb
      # Project root - mounted at same absolute path as host so cwd in
      # ~/.claude/projects/*.jsonl resolves inside the container.
      - ${HOME}/elec:${HOME}/elec

volumes:
  claude-web-elec-state:
